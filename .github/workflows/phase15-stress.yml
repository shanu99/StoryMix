name: StoryMix 1080p and long-project stress tests
on:
  push:
    branches: [feature/phase1-aac-ffmpeg-fallback]
    paths: ['next/src/**', 'next/e2e/stress.spec.ts', '.github/workflows/phase15-stress.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: next
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install chromium
      - name: Prepare fixture encoder
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
      - name: Create real 1080p 3s H264/AAC and 5-minute looped media
        run: |
          mkdir -p e2e/fixtures
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=1920x1080:rate=30 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 3 -c:v libx264 -preset ultrafast -crf 28 -pix_fmt yuv420p -c:a aac -shortest -movflags +faststart e2e/fixtures/test-hd.mp4
          ffmpeg -hide_banner -loglevel error -y -stream_loop 100 -i e2e/fixtures/test-hd.mp4 -t 300 -c copy -movflags +faststart e2e/fixtures/test-five-minute.mp4
          ffprobe -hide_banner -v error -show_entries format=duration -of default=nw=1 e2e/fixtures/test-five-minute.mp4
      - name: Run 1080p and 5-minute browser stress gates
        run: STORYMIX_STRESS=1 npx playwright test e2e/stress.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: storymix-stress-failure
          path: next/test-results/
          retention-days: 7
