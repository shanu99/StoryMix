name: Build StoryMix Elah editor
on:
  push:
    branches: [rebuild/editor-foundation, phase1/core-editor-verification, design/version-c-hybrid-ui, design/capcut-consistent-toolbar]
  pull_request:
    paths: ['next/**','.github/workflows/build-rebuild.yml']
permissions:
  contents: read
jobs:
  editor-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: next
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Install fixture encoder
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Generate H264 test media
        run: |
          mkdir -p e2e/fixtures
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=640x360:rate=30 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 3 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest -movflags +faststart e2e/fixtures/test-video.mp4
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: storymix-elah-build
          path: next/dist
