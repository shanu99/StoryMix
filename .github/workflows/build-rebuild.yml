name: Build StoryMix Elah editor
on:
  push:
    branches: [rebuild/editor-foundation, phase1/core-editor-verification]
  pull_request:
    paths: ['next/**','.github/workflows/build-rebuild.yml']
permissions:
  contents: read
jobs:
  editor-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: next
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: storymix-elah-build
          path: next/dist
